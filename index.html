<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber & Cosmic Cat : Visualiseur Musical Immersif (Démo & Test)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010104;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #cyber-cat-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
        }
        /* Top Audio Source Bar */
        .demo-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            background: rgba(12, 10, 26, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 999px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 240, 255, 0.2);
        }
        .demo-btn {
            background: rgba(20, 16, 40, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }
        .demo-btn:hover {
            color: #00f0ff;
            border-color: rgba(0, 240, 255, 0.6);
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
        .demo-btn.active {
            background: rgba(0, 240, 255, 0.25);
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
        }
        .demo-separator {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }
        #audio-file-input {
            display: none;
        }

        /* The 2 discrete bottom buttons (mirroring Spotify playbar buttons) */
        .bottom-controls-bar {
            position: fixed;
            bottom: 24px;
            right: 28px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(12, 10, 26, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 8px 14px;
            border-radius: 30px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
        }

        .action-icon-btn {
            background: transparent;
            border: 0;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }
        .action-icon-btn:hover {
            color: #00f0ff;
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6));
        }
        .action-icon-btn.active {
            color: #00f0ff;
            filter: drop-shadow(0 0 8px #00f0ff);
        }
        .action-icon-btn.inactive {
            color: #666666;
            filter: none;
        }

        /* Shortcut Guide Toast */
        .shortcut-legend {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(10, 8, 20, 0.75);
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        .shortcut-legend kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            color: #00f0ff;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <canvas id="cyber-cat-canvas"></canvas>

    <!-- Top Audio Source Selection -->
    <div class="demo-bar">
        <button id="btn-synth" class="demo-btn" title="Activer la musique synthétisée intégrée (124 BPM)">
            🎵 Beat Synth
        </button>
        <button id="btn-mic" class="demo-btn" title="Connecter le microphone pour l'audio-réactivité">
            🎙️ Micro
        </button>
        <button id="btn-file" class="demo-btn" title="Charger un fichier audio local">
            📂 Fichier
        </button>
        <input type="file" id="audio-file-input" accept="audio/*">
    </div>

    <!-- The 2 Discrete Floating Buttons (On/Off & Settings) -->
    <div class="bottom-controls-bar">
        <!-- 1. Bouton On/Off -->
        <button id="cosmic-cat-toggle-btn" class="action-icon-btn active" title="Visualiseur Chat : Activer / Désactiver">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 2C9.5 2 7.4 3.8 7 6.2 4.6 7.8 3 10.7 3 14c0 5 4 9 9 9s9-4 9-9c0-3.3-1.6-6.2-4-7.8C16.6 3.8 14.5 2 12 2zm-3.2 1.8l1.6 2.4c-.6.4-1.1.9-1.4 1.5L6.5 6.6l2.3-2.8zm6.4 0l2.3 2.8-2.5 1.1c-.3-.6-.8-1.1-1.4-1.5l1.6-2.4z"/>
            </svg>
        </button>
        <!-- 2. Bouton Paramètres ⚙️ -->
        <button id="cosmic-cat-settings-btn" class="action-icon-btn" title="Paramètres du Visualiseur (Modèle, Couleurs, Effets)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </button>
    </div>

    <div class="shortcut-legend">
        Raccourcis : <kbd>A</kbd> On/Off &nbsp;|&nbsp; <kbd>C</kbd> Modèle &nbsp;|&nbsp; <kbd>T</kbd> Couleur &nbsp;|&nbsp; <kbd>F</kbd> Plein Écran
    </div>

    <!-- Compiled Bundle Script -->
    <script src="dist/cat-visualizer.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('cyber-cat-canvas');
            if (!canvas || typeof VisualizerEngine === 'undefined') return;

            const engine = new VisualizerEngine(canvas);
            window.engine = engine;

            // Wire up the 2 buttons
            const toggleBtn = document.getElementById('cosmic-cat-toggle-btn');
            const settingsBtn = document.getElementById('cosmic-cat-settings-btn');

            toggleBtn.addEventListener('click', () => {
                engine.toggleActive();
                toggleBtn.classList.toggle('active', engine.isActive);
                toggleBtn.classList.toggle('inactive', !engine.isActive);
            });

            settingsBtn.addEventListener('click', () => {
                if (typeof window.toggleSettingsDropdown === 'function') {
                    window.toggleSettingsDropdown(() => engine);
                }
            });

            // Web Audio 124 BPM Synth Loop for instant out-of-the-box demo
            let synthContext = null;
            let synthInterval = null;
            let isSynthRunning = false;

            function startSynth() {
                if (isSynthRunning) {
                    stopSynth();
                    return;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                if (!synthContext) synthContext = new AudioCtx();
                if (synthContext.state === 'suspended') synthContext.resume();

                // Connect to visualizer engine
                engine.audio.connectLiveSource(synthContext.destination);

                let step = 0;
                const tempo = 124;
                const stepTime = (60 / tempo) / 4; // 16th notes

                synthInterval = setInterval(() => {
                    const t = synthContext.currentTime;

                    // Kick Drum on quarter notes (steps 0, 4, 8, 12)
                    if (step % 4 === 0) {
                        const osc = synthContext.createOscillator();
                        const gain = synthContext.createGain();
                        osc.frequency.setValueAtTime(140, t);
                        osc.frequency.exponentialRampToValueAtTime(32, t + 0.12);
                        gain.gain.setValueAtTime(0.9, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                        osc.connect(gain);
                        gain.connect(synthContext.destination);
                        osc.start(t);
                        osc.stop(t + 0.25);
                    }

                    // Snare on beats 2 and 4 (steps 4, 12)
                    if (step % 8 === 4) {
                        const osc = synthContext.createOscillator();
                        const gain = synthContext.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(220, t);
                        osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
                        gain.gain.setValueAtTime(0.45, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                        osc.connect(gain);
                        gain.connect(synthContext.destination);
                        osc.start(t);
                        osc.stop(t + 0.18);
                    }

                    // Cyber Bass Synth arpeggio
                    const notes = [55, 55, 65.4, 73.4, 82.4, 98, 73.4, 65.4];
                    const freq = notes[step % notes.length];
                    const bassOsc = synthContext.createOscillator();
                    const bassGain = synthContext.createGain();
                    bassOsc.type = 'sawtooth';
                    bassOsc.frequency.setValueAtTime(freq, t);
                    bassGain.gain.setValueAtTime(0.2, t);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
                    bassOsc.connect(bassGain);
                    bassGain.connect(synthContext.destination);
                    bassOsc.start(t);
                    bassOsc.stop(t + 0.14);

                    step = (step + 1) % 16;
                }, stepTime * 1000);

                isSynthRunning = true;
                document.getElementById('btn-synth').classList.add('active');
            }

            function stopSynth() {
                if (synthInterval) clearInterval(synthInterval);
                synthInterval = null;
                isSynthRunning = false;
                document.getElementById('btn-synth').classList.remove('active');
            }

            document.getElementById('btn-synth').addEventListener('click', startSynth);

            document.getElementById('btn-mic').addEventListener('click', async () => {
                try {
                    stopSynth();
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    engine.audio.connectLiveSource(stream);
                    document.getElementById('btn-mic').classList.add('active');
                } catch (err) {
                    alert("Accès microphone non accordé : " + err.message);
                }
            });

            const fileInput = document.getElementById('audio-file-input');
            document.getElementById('btn-file').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                stopSynth();
                const audioEl = new Audio(URL.createObjectURL(file));
                audioEl.play();
                engine.audio.connectLiveSource(audioEl);
                document.getElementById('btn-file').classList.add('active');
            });
        });
    </script>
</body>
</html>
