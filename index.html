<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber & Cosmic Cat : Visualiseur Musical Immersif (Démo & Test)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010104;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #cyber-cat-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
        }
        /* Glassmorphic Test Bench Bar */
        .demo-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            background: rgba(12, 10, 26, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 999px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 240, 255, 0.2);
        }
        .demo-btn {
            background: rgba(20, 16, 40, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }
        .demo-btn:hover {
            color: #00f0ff;
            border-color: rgba(0, 240, 255, 0.6);
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
        .demo-btn.active {
            background: rgba(0, 240, 255, 0.25);
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
        }
        .demo-separator {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }
        #audio-file-input {
            display: none;
        }
        /* Shortcut Guide Toast */
        .shortcut-legend {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(10, 8, 20, 0.7);
            padding: 5px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        .shortcut-legend kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            color: #00f0ff;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <canvas id="cyber-cat-canvas"></canvas>

    <!-- Top Demo Controls -->
    <div class="demo-bar">
        <button id="btn-synth" class="demo-btn" title="Activer la musique synthétisée intégrée">
            🎵 Beat Synth
        </button>
        <button id="btn-mic" class="demo-btn" title="Connecter le microphone pour l'audio-réactivité">
            🎙️ Micro
        </button>
        <button id="btn-file" class="demo-btn" title="Charger un fichier audio local">
            📂 Fichier
        </button>
        <input type="file" id="audio-file-input" accept="audio/*">

        <div class="demo-separator"></div>

        <button id="btn-cat" class="demo-btn" title="Alterner Modèle (C)">
            🐱 Modèle
        </button>
        <button id="btn-bg" class="demo-btn" title="Alterner Arrière-plan (G)">
            ✨ Décor
        </button>
        <button id="btn-theme" class="demo-btn" title="Alterner Palette (T)">
            🎨 Thème
        </button>
        <button id="btn-fs" class="demo-btn" title="Plein Écran (F)">
            ⛶
        </button>
    </div>

    <div class="shortcut-legend">
        Raccourcis : <kbd>C</kbd> Modèle &nbsp;|&nbsp; <kbd>G</kbd> Décor &nbsp;|&nbsp; <kbd>T</kbd> Thème &nbsp;|&nbsp; <kbd>A</kbd> Pause/Figer &nbsp;|&nbsp; <kbd>F</kbd> Plein Écran
    </div>

    <!-- Bundle Script -->
    <script src="dist/cat-visualizer.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('cyber-cat-canvas');
            if (!canvas || typeof VisualizerEngine === 'undefined') return;

            const engine = new VisualizerEngine(canvas);
            window.engine = engine;

            // Simple Web Audio 124 BPM Synth Loop for instant out-of-the-box demo
            let synthContext = null;
            let synthInterval = null;
            let isSynthRunning = false;

            function startSynth() {
                if (isSynthRunning) {
                    stopSynth();
                    return;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                if (!synthContext) synthContext = new AudioCtx();
                if (synthContext.state === 'suspended') synthContext.resume();

                // Connect to visualizer engine
                engine.audio.connectLiveSource(synthContext.destination);

                let step = 0;
                const tempo = 124;
                const stepTime = (60 / tempo) / 4; // 16th notes

                synthInterval = setInterval(() => {
                    const t = synthContext.currentTime;

                    // Kick Drum on quarter notes (steps 0, 4, 8, 12)
                    if (step % 4 === 0) {
                        const osc = synthContext.createOscillator();
                        const gain = synthContext.createGain();
                        osc.frequency.setValueAtTime(140, t);
                        osc.frequency.exponentialRampToValueAtTime(32, t + 0.12);
                        gain.gain.setValueAtTime(0.9, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                        osc.connect(gain);
                        gain.connect(synthContext.destination);
                        osc.start(t);
                        osc.stop(t + 0.25);
                    }

                    // Snare on beats 2 and 4 (steps 4, 12)
                    if (step % 8 === 4) {
                        const osc = synthContext.createOscillator();
                        const gain = synthContext.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(220, t);
                        osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
                        gain.gain.setValueAtTime(0.45, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                        osc.connect(gain);
                        gain.connect(synthContext.destination);
                        osc.start(t);
                        osc.stop(t + 0.18);
                    }

                    // Cyber Bass Synth arpeggio
                    const notes = [55, 55, 65.4, 73.4, 82.4, 98, 73.4, 65.4];
                    const freq = notes[step % notes.length];
                    const bassOsc = synthContext.createOscillator();
                    const bassGain = synthContext.createGain();
                    bassOsc.type = 'sawtooth';
                    bassOsc.frequency.setValueAtTime(freq, t);
                    bassGain.gain.setValueAtTime(0.2, t);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
                    bassOsc.connect(bassGain);
                    bassGain.connect(synthContext.destination);
                    bassOsc.start(t);
                    bassOsc.stop(t + 0.14);

                    step = (step + 1) % 16;
                }, stepTime * 1000);

                isSynthRunning = true;
                document.getElementById('btn-synth').classList.add('active');
            }

            function stopSynth() {
                if (synthInterval) clearInterval(synthInterval);
                synthInterval = null;
                isSynthRunning = false;
                document.getElementById('btn-synth').classList.remove('active');
            }

            // Button Event Listeners
            document.getElementById('btn-synth').addEventListener('click', startSynth);

            document.getElementById('btn-mic').addEventListener('click', async () => {
                try {
                    stopSynth();
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    engine.audio.connectLiveSource(stream);
                    document.getElementById('btn-mic').classList.add('active');
                } catch (err) {
                    alert("Accès microphone non accordé : " + err.message);
                }
            });

            const fileInput = document.getElementById('audio-file-input');
            document.getElementById('btn-file').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                stopSynth();
                const audioEl = new Audio(URL.createObjectURL(file));
                audioEl.play();
                engine.audio.connectLiveSource(audioEl);
                document.getElementById('btn-file').classList.add('active');
            });

            document.getElementById('btn-cat').addEventListener('click', () => {
                const cur = engine.nextCat();
                document.getElementById('btn-cat').textContent = cur === 'cyber' ? '🐱 Cyber Cat' : '🌌 Cosmic Cat';
            });

            document.getElementById('btn-bg').addEventListener('click', () => {
                const cur = engine.nextBackground();
                const map = { stars: '✨ Étoiles', grid: '🌐 Grille', fractals: '☸️ Fractales', nebula: '🌌 Nébuleuse', minimal: '🌑 Minimal' };
                document.getElementById('btn-bg').textContent = map[cur] || cur;
            });

            document.getElementById('btn-theme').addEventListener('click', () => {
                engine.nextPalette();
            });

            document.getElementById('btn-fs').addEventListener('click', () => {
                engine.toggleFullscreen();
            });
        });
    </script>
</body>
</html>
